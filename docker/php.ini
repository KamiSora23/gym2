; Producción
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
date.timezone = America/Lima

; Subida de logos y fotos de productos (la app valida máx. 2 MB)
upload_max_filesize = 8M
post_max_size = 10M

; OPcache: el código no cambia dentro del contenedor
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
